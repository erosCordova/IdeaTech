[tool.ruff]
line-length = 88
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
# Reglas base + imports y piroriedades comunes en FastAPI.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` como valor por defecto es el idiom oficial de FastAPI.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Header",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
